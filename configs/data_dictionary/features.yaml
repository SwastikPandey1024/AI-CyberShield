# CICIDS2017 Feature Definitions
# ===============================
# Each entry defines metadata for one feature in the CICIDS2017 dataset.
#
# Fields:
#   name:           Raw column name from the source CSV
#   dtype:          Expected pandas/numpy data type string
#   description:    Human-readable description
#   feature_type:   Semantic category (flow, time, flag, payload, subflow, idle, label)
#   expected_range: Expected min/max values as a list [min, max] or null
#   unit:           Measurement unit or null
#   is_categorical: Whether the feature is categorical
#   is_target:      Whether this is the target/label column
#   nullable:       Whether null values are expected
#   source_dataset: Dataset this feature originates from
#
# TODO: Add full feature set (79+ features from CICIDS2017).
# TODO: Add per-dataset versioning support.

features:
